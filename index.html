<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FORMULA ONE · Nishka Mehta</title>
  <meta name="description" content="Formula One Engineering & Aerodynamics Experience designed and developed by Nishka Mehta.">
  <link rel="icon" type="image/svg+xml" href="/assets/meta/favIcons/favicon.svg">
  <link rel="icon" type="image/png" href="/assets/meta/favIcons/favicon-96x96.png" sizes="96x96">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/meta/favIcons/apple-touch-icon.png">
  <link rel="manifest" href="/assets/meta/favIcons/site.webmanifest">
  <meta name="theme-color" content="#000000">

  <style>
    @font-face {
      font-family: 'Agency FB';
      src: url('/assets/fonts/agencyFB/agencyfb_reg.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Agency FB';
      src: url('/assets/fonts/agencyFB/agencyfb_bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Geist';
      src: url('/assets/fonts/geist/geist-variable.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: 'Agency FB', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .lab-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 48px 32px;
      background-color: #000000;
      opacity: 0;
      animation: fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      z-index: 10;
    }

    @media (prefers-reduced-motion: reduce) {
      .lab-screen {
        animation: none;
        opacity: 1;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Top Bar */
    .lab-top {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .lab-badge {
      font-size: 1.1rem;
      font-weight: 400;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
      display: inline-flex;
      align-items: baseline;
    }

    .lab-badge::before {
      content: '[';
      margin-right: 2px;
      color: rgba(255, 255, 255, 0.3);
    }
    .lab-badge::after {
      content: ']';
      margin-left: 2px;
      color: rgba(255, 255, 255, 0.3);
    }

    .lab-version {
      font-family: 'Geist', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      color: rgba(255, 255, 255, 0.35);
      text-transform: uppercase;
    }

    /* Center Section */
    .lab-center {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: 900px;
      margin: auto 0;
    }

    .lab-title {
      font-size: clamp(3.2rem, 11vw, 8.5rem);
      font-weight: 700;
      letter-spacing: 0.24em;
      line-height: 0.95;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 28px;
      text-indent: 0.24em; /* Balances right letter-spacing */
      user-select: none;
    }

    .lab-quote {
      font-family: 'Geist', -apple-system, sans-serif;
      font-size: clamp(0.95rem, 1.8vw, 1.25rem);
      font-weight: 300;
      letter-spacing: 0.12em;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.72);
      max-width: 600px;
      margin-bottom: 44px;
      font-style: italic;
    }

    .lab-enter-btn {
      display: inline-flex;
      align-items: baseline;
      font-family: 'Agency FB', sans-serif;
      font-size: 1.35rem;
      font-weight: 400;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      text-decoration: none;
      color: #ffffff;
      background-color: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 12px 32px 10px 36px;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .lab-enter-btn::before {
      content: '[';
      margin-right: 6px;
      color: rgba(255, 255, 255, 0.4);
    }
    .lab-enter-btn::after {
      content: ']';
      margin-left: 6px;
      color: rgba(255, 255, 255, 0.4);
    }

    .lab-enter-btn:hover {
      background-color: #ffffff;
      color: #000000;
      border-color: #ffffff;
      transform: translateY(-1px);
    }
    .lab-enter-btn:hover::before,
    .lab-enter-btn:hover::after {
      color: rgba(0, 0, 0, 0.5);
    }

    /* Bottom Credits */
    .lab-bottom {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
    }

    .lab-credit-label {
      font-family: 'Geist', monospace;
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.36);
    }

    .lab-credit-name {
      font-family: 'Agency FB', sans-serif;
      font-size: 1.55rem;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #ffffff;
      margin-top: 1px;
    }

    @media (max-width: 768px) {
      .lab-screen {
        padding: 32px 20px;
      }
      .lab-title {
        margin-bottom: 20px;
      }
      .lab-quote {
        margin-bottom: 36px;
      }
    }
  </style>
</head>
<body>
  <main class="lab-screen">
    <div class="lab-top">
      <div class="lab-badge">R&amp;D ENGINEERING</div>
      <div class="lab-version">LAB // INTERACTIVE</div>
    </div>

    <div class="lab-center">
      <h1 class="lab-title">FORMULA ONE</h1>
      <p class="lab-quote">“Speed is a science. Precision is an art.”</p>
      <a href="/demo/demoFormula/" class="lab-enter-btn" id="enterBtn" aria-label="Enter Formula One 3D Experience">
        EXPLORE CAR
      </a>
    </div>

    <div class="lab-bottom">
      <span class="lab-credit-label">DESIGNED &amp; DEVELOPED BY</span>
      <span class="lab-credit-name">Nishka Mehta</span>
    </div>
  </main>
</body>
</html>
